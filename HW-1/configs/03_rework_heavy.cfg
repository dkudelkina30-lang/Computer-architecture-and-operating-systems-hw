# Высокий брак с многократной переделкой. Заготовок с запасом, план выполняется, но с большим числом повторных обработок.

machine CUT   1
machine BEND  1
machine PAINT 1
part BRACKET raw 30 defect 0.40 rework 2 max_rework 3 route CUT:2 BEND:3 PAINT:2
part PANEL   raw 20 defect 0.30 rework 1 max_rework 2 route CUT:3 PAINT:3
product CABINET plan 4 kit BRACKET:2 PANEL:1
inspectors 1
inspect_time 1
stations 1
assembly_time 3
robots 2
transport_time 1
queue_capacity 3
outbuf_capacity 2
qc_queue_capacity 3
qc_out_capacity 3
kit_capacity 4
release_interval 2
seed 11
