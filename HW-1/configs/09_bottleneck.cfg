# Медленный станок TRIM с очередью на одну деталь.
# Быстрые штампы STAMP успевают сделать следующую деталь, а предыдущую
# некуда везти: выходной накопитель (1 место) заполнен, и штамп
# приостанавливается, пока не освободится место.

machine STAMP 2
machine TRIM  1
part CLIP raw 12 defect 0.05 rework 1 max_rework 1 route STAMP:1 TRIM:5
product PACK plan 3 kit CLIP:4
inspectors 1
inspect_time 1
stations 1
assembly_time 1
robots 3
transport_time 1
queue_capacity 1
outbuf_capacity 1
qc_queue_capacity 2
qc_out_capacity 1
kit_capacity 4
release_interval 0
seed 2
